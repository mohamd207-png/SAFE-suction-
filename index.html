<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAFE-Suction™ — 3D Interactive ICU Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #060a10;
            color: #f8fafc;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* Top Floating Header */
        .hud-top {
            position: fixed;
            top: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hud-brand {
            background: rgba(15, 23, 36, 0.88);
            border: 1px solid #1e293b;
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .badge {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: #000;
            font-weight: 900;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .brand-info h1 {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
        }

        .brand-info p {
            font-size: 10px;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        /* Camera View Switcher (Includes Screen Focus) */
        .cam-controls {
            background: rgba(15, 23, 36, 0.9);
            border: 1px solid #1e293b;
            backdrop-filter: blur(10px);
            padding: 5px;
            border-radius: 12px;
            display: flex;
            gap: 6px;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .cam-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #94a3b8;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cam-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .cam-btn.active {
            background: #06b6d4;
            color: #000;
            box-shadow: 0 2px 10px rgba(6, 182, 212, 0.4);
        }

        /* Bottom Scenario & Profile Dock */
        .hud-bottom {
            position: fixed;
            bottom: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            z-index: 10;
        }

        .dock-bar {
            background: rgba(15, 23, 36, 0.92);
            border: 1px solid #1e293b;
            backdrop-filter: blur(12px);
            padding: 8px 12px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.65);
            max-width: 100%;
            overflow-x: auto;
        }

        .sc-btn {
            background: #0f172a;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 6px 11px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .sc-btn:hover {
            border-color: #06b6d4;
            color: #fff;
        }

        .sc-btn.active {
            background: #06b6d4;
            color: #000;
            border-color: #06b6d4;
        }

        .sc-btn.tissue.active {
            background: #a855f7;
            color: #fff;
            border-color: #c084fc;
        }

        .divider {
            width: 1px;
            height: 22px;
            background: #334155;
            margin: 0 2px;
        }

        .auto-btn {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border: none;
            color: #fff;
            padding: 7px 13px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        .hint-pill {
            font-size: 11px;
            color: #94a3b8;
            background: rgba(8, 13, 20, 0.75);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
        }
    </style>
</head>
<body>

    <!-- Top Floating HUD -->
    <div class="hud-top">
        <div class="hud-brand">
            <span class="badge">SAFE-SUCTION™</span>
            <div class="brand-info">
                <h1>3D Digital Twin & Telemetry Console</h1>
                <p>PSMCHS Critical Care Innovation</p>
            </div>
        </div>

        <div class="cam-controls">
            <button class="cam-btn active" id="camOverview" onclick="setCameraView('OVERVIEW')">
                🏥 3D Device View
            </button>
            <button class="cam-btn" id="camScreen" onclick="setCameraView('SCREEN')">
                📱 Screen Focus (منظور الشاشة)
            </button>
            <button class="cam-btn" id="camValve" onclick="setCameraView('VALVE')">
                💨 Fail-Safe Vent & Ports
            </button>
        </div>
    </div>

    <!-- 3D Viewport -->
    <div id="canvas-container"></div>

    <!-- Bottom Interactive Controls -->
    <div class="hud-bottom">
        <div class="hint-pill">Drag to rotate 3D • Pinch/Scroll to zoom • Click directly on the 3D screen buttons</div>
        <div class="dock-bar">
            <button class="sc-btn active" onclick="setScenario('NORMAL')">1. Normal</button>
            <button class="sc-btn" onclick="setScenario('PARTIAL')">2. Partial Clog</button>
            <button class="sc-btn" onclick="setScenario('BLOCK')">3. Complete Clog</button>
            <button class="sc-btn tissue" onclick="setScenario('TISSUE')">4. Tissue Contact (Vent)</button>
            <button class="sc-btn" onclick="setScenario('LEAK')">5. Air Leak</button>
            <button class="sc-btn" onclick="setScenario('UNKNOWN')">6. Undetermined</button>
            <div class="divider"></div>
            <button class="sc-btn" onclick="cycleProfile()">Profile: <span id="hudProfile">ADULT</span></button>
            <button class="sc-btn" onclick="cycleMode()">Mode: <span id="hudMode">EVAC</span></button>
            <button class="auto-btn" id="autoBtn" onclick="toggleAutoSim()">▶ Auto-Demo</button>
        </div>
    </div>

    <!-- Three.js & OrbitControls (Reliable Global Build for iPad/Safari/Desktop) -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ==========================================
        // 1. CLINICAL STATE & TELEMETRY ENGINE
        // ==========================================
        let currentProfile = 'ADULT'; // ADULT, PEDIATRIC, NEONATAL
        let currentMode = 'SUBGLOTTIC'; // SUBGLOTTIC, CO_PILOT
        let currentScenario = 'NORMAL';
        let isVentOpen = false;
        let isAutoSim = false;
        let autoTimer = null;
        let autoIdx = 0;

        const limits = {
            ADULT:     { maxP: 150, defP: 100, defF: 15.0, ett: 'ETT 7.5mm • Teeth: 22cm', depthTxt: '22 cm / Mark 24 cm', fill: 0.35 },
            PEDIATRIC: { maxP: 100, defP: 80,  defF: 9.0,  ett: 'ETT 5.0mm • Lip: 14.0cm', depthTxt: '13.5 cm / Max 15.0 cm', fill: 0.45 },
            NEONATAL:  { maxP: 80,  defP: 60,  defF: 4.5,  ett: 'ETT 3.0mm • Lip: 8.5cm',  depthTxt: '8.5 cm / Max 9.0 cm',   fill: 0.62 }
        };

        const pHistory = new Array(110).fill(-100);
        const fHistory = new Array(110).fill(15.0);
        let liveP = -100;
        let liveF = 15.0;
        let liveDP = "-0.4";

        function setProfile(p) {
            currentProfile = p;
            document.getElementById('hudProfile').textContent = p === 'PEDIATRIC' ? 'PEDS' : (p === 'NEONATAL' ? 'NEO' : 'ADULT');
        }

        function cycleProfile() {
            const order = ['ADULT', 'PEDIATRIC', 'NEONATAL'];
            setProfile(order[(order.indexOf(currentProfile) + 1) % order.length]);
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('hudMode').textContent = m === 'SUBGLOTTIC' ? 'EVAC' : 'DEEP';
        }

        function cycleMode() {
            setMode(currentMode === 'SUBGLOTTIC' ? 'CO_PILOT' : 'SUBGLOTTIC');
        }

        function setScenario(sc) {
            currentScenario = sc;
            document.querySelectorAll('.sc-btn').forEach(b => {
                if (b.textContent.match(/^\d\./)) {
                    b.classList.toggle('active', b.textContent.toUpperCase().includes(sc));
                }
            });
            isVentOpen = (sc === 'TISSUE');
        }

        function toggleManualVent() {
            isVentOpen = !isVentOpen;
        }

        const autoSequence = [
            { sc: 'NORMAL',  ms: 4500 },
            { sc: 'PARTIAL', ms: 4000 },
            { sc: 'BLOCK',   ms: 4000 },
            { sc: 'TISSUE',  ms: 5000 },
            { sc: 'LEAK',    ms: 3500 },
            { sc: 'NORMAL',  ms: 4000 }
        ];

        function toggleAutoSim() {
            const btn = document.getElementById('autoBtn');
            if (isAutoSim) {
                isAutoSim = false;
                clearTimeout(autoTimer);
                btn.textContent = '▶ Auto-Demo';
                setScenario('NORMAL');
            } else {
                isAutoSim = true;
                autoIdx = 0;
                btn.textContent = '⏹ Stop Demo';
                runAutoStep();
            }
        }

        function runAutoStep() {
            if (!isAutoSim) return;
            const step = autoSequence[autoIdx];
            setScenario(step.sc);
            autoIdx = (autoIdx + 1) % autoSequence.length;
            autoTimer = setTimeout(runAutoStep, step.ms);
        }

        // ==========================================
        // 2. HIGH-RES 2D SCREEN CANVAS (MATCHES UI.HTML)
        // ==========================================
        const uiCanvas = document.createElement('canvas');
        uiCanvas.width = 1280;
        uiCanvas.height = 800;
        const ctx = uiCanvas.getContext('2d');

        function roundRect(c, x, y, w, h, r) {
            c.beginPath();
            c.moveTo(x + r, y);
            c.arcTo(x + w, y, x + w, y + h, r);
            c.arcTo(x + w, y + h, x, y + h, r);
            c.arcTo(x, y + h, x, y, r);
            c.arcTo(x, y, x + w, y, r);
            c.closePath();
        }

        function updateTelemetryMath() {
            const cfg = limits[currentProfile];
            let targetP = -cfg.defP;
            let targetF = cfg.defF;

            if (currentScenario === 'NORMAL') {
                targetP += (Math.random() * 4 - 2);
                targetF += (Math.random() * 0.7 - 0.35);
                liveDP = "-0.4";
            } else if (currentScenario === 'PARTIAL') {
                targetP = -cfg.maxP * 0.85 + (Math.random() * 5 - 2.5);
                targetF = cfg.defF * 0.35 + (Math.random() * 0.4 - 0.2);
                liveDP = "-8.5";
            } else if (currentScenario === 'BLOCK') {
                targetP = -cfg.maxP - 15 + (Math.random() * 2 - 1);
                targetF = 0.2 + (Math.random() * 0.1);
                liveDP = "-14.2";
            } else if (currentScenario === 'TISSUE') {
                if (isVentOpen) {
                    targetP = -3 + (Math.random() * 2);
                    targetF = 21.5 + (Math.random() * 1.5);
                    liveDP = "+38.0";
                } else {
                    targetP = -cfg.maxP - 25;
                    targetF = 0.0;
                    liveDP = "-42.5";
                }
            } else if (currentScenario === 'LEAK') {
                targetP = -8 + (Math.random() * 2.5);
                targetF = 24.0 + (Math.random() * 1.2);
                liveDP = "+0.1";
            } else if (currentScenario === 'UNKNOWN') {
                targetP = -55 + Math.sin(Date.now() / 110) * 35;
                targetF = 8.0 + Math.cos(Date.now() / 150) * 5.5;
                liveDP = "ERR";
            }

            if (isVentOpen && currentScenario !== 'TISSUE') {
                targetP = -2;
                targetF = 20.0;
                liveDP = "+29.0";
            }

            liveP = targetP;
            liveF = targetF;
            pHistory.shift(); pHistory.push(liveP);
            fHistory.shift(); fHistory.push(liveF);
        }

        function drawScreenUI() {
            const W = 1280, H = 800;
            const cfg = limits[currentProfile];

            // Background
            ctx.fillStyle = '#080d14';
            ctx.fillRect(0, 0, W, H);

            // --- HEADER BAR (y: 0..84) ---
            const hdrGrad = ctx.createLinearGradient(0, 0, 0, 84);
            hdrGrad.addColorStop(0, '#131d2e');
            hdrGrad.addColorStop(1, '#0d1522');
            ctx.fillStyle = hdrGrad;
            ctx.fillRect(0, 0, W, 84);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, 84); ctx.lineTo(W, 84); ctx.stroke();

            // Brand Badge
            const bGrad = ctx.createLinearGradient(24, 20, 195, 64);
            bGrad.addColorStop(0, '#06b6d4');
            bGrad.addColorStop(1, '#3b82f6');
            ctx.fillStyle = bGrad;
            roundRect(ctx, 24, 20, 175, 44, 8);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = '900 18px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('SAFE-SUCTION™', 111, 48);

            // Title & Subtitle
            ctx.textAlign = 'left';
            ctx.fillStyle = '#f8fafc';
            ctx.font = '700 21px sans-serif';
            ctx.fillText('PSMCHS Smart Airway Unit', 216, 41);
            ctx.fillStyle = '#06b6d4';
            ctx.font = '600 13px sans-serif';
            ctx.fillText('CLOSED-LOOP MUCOSAL TRAUMA PREVENTION', 216, 62);

            // Profile Buttons (x: 610..845)
            ctx.fillStyle = '#090e17';
            roundRect(ctx, 610, 20, 235, 44, 10); ctx.fill();
            ctx.strokeStyle = '#1e293b'; ctx.stroke();
            const profs = ['ADULT', 'PEDS', 'NEO'];
            const profKeys = ['ADULT', 'PEDIATRIC', 'NEONATAL'];
            profs.forEach((lbl, i) => {
                const bx = 615 + i * 76;
                if (currentProfile === profKeys[i]) {
                    ctx.fillStyle = '#1e293b';
                    roundRect(ctx, bx, 24, 72, 36, 7); ctx.fill();
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = '#94a3b8';
                }
                ctx.font = '700 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(lbl, bx + 36, 47);
            });

            // Mode Buttons (x: 860..1145)
            ctx.fillStyle = '#090e17';
            roundRect(ctx, 860, 20, 285, 44, 10); ctx.fill();
            ctx.strokeStyle = '#1e293b'; ctx.stroke();
            const modes = ['SUBGLOTTIC (EVAC)', 'CO-PILOT (DEEP)'];
            const modeKeys = ['SUBGLOTTIC', 'CO_PILOT'];
            modes.forEach((lbl, i) => {
                const bx = 865 + i * 138;
                if (currentMode === modeKeys[i]) {
                    ctx.fillStyle = '#1e293b';
                    roundRect(ctx, bx, 24, 134, 36, 7); ctx.fill();
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = '#94a3b8';
                }
                ctx.font = '700 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(lbl, bx + 67, 47);
            });

            // Clock
            ctx.fillStyle = '#10b981';
            ctx.beginPath(); ctx.arc(1168, 42, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#94a3b8';
            ctx.font = '600 15px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(new Date().toTimeString().split(' ')[0], 1180, 47);

            // --- THREE COLUMNS LAYOUT (y: 104..780) ---
            const colY = 104, colH = 676;

            // === COLUMN 1: WAVEFORMS (x: 24, w: 520) ===
            ctx.fillStyle = '#0f1724';
            roundRect(ctx, 24, colY, 520, colH, 16); ctx.fill();
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = '#94a3b8';
            ctx.font = '700 15px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('REAL-TIME FLUIDICS TELEMETRY', 44, 136);
            ctx.fillStyle = '#06b6d4';
            ctx.textAlign = 'right';
            ctx.fillText(`dP/dt: ${liveDP} mmHg/s`, 524, 136);

            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.beginPath(); ctx.moveTo(44, 150); ctx.lineTo(524, 150); ctx.stroke();

            // Pressure Wave Box
            drawWavePanel(44, 166, 480, 290, 'VACUUM PRESSURE (P) [mmHg]', pHistory, -cfg.maxP - 30, 0, '#06b6d4');
            // Flow Wave Box
            drawWavePanel(44, 472, 480, 290, 'ASPIRATION FLOW (Q) [L/min]', fHistory, 0, 30, '#10b981');

            // === COLUMN 2: DIAGNOSTICS & DEPTH GUIDE (x: 562, w: 380) ===
            ctx.fillStyle = '#0f1724';
            roundRect(ctx, 562, colY, 380, colH, 16); ctx.fill();
            ctx.strokeStyle = '#1e293b'; ctx.stroke();

            ctx.fillStyle = '#94a3b8';
            ctx.font = '700 15px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('AIRWAY LINE DIAGNOSTICS', 582, 136);
            ctx.textAlign = 'right';
            ctx.font = '600 13px sans-serif';
            ctx.fillText(`Limit: -${cfg.maxP} mmHg`, 922, 136);

            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.beginPath(); ctx.moveTo(582, 150); ctx.lineTo(922, 150); ctx.stroke();

            // Readout Box 1 (Pressure)
            ctx.fillStyle = '#090e17';
            roundRect(ctx, 582, 168, 162, 135, 12); ctx.fill();
            ctx.strokeStyle = '#1e293b'; ctx.stroke();
            ctx.fillStyle = '#94a3b8'; ctx.font = '700 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('NEGATIVE PRESSURE', 663, 194);
            ctx.fillStyle = '#06b6d4'; ctx.font = '900 46px sans-serif';
            ctx.fillText(Math.round(liveP).toString(), 663, 250);
            ctx.fillStyle = '#94a3b8'; ctx.font = '600 13px sans-serif';
            ctx.fillText('mmHg (Gauge)', 663, 282);

            // Readout Box 2 (Flow)
            ctx.fillStyle = '#090e17';
            roundRect(ctx, 760, 168, 162, 135, 12); ctx.fill();
            ctx.strokeStyle = '#1e293b'; ctx.stroke();
            ctx.fillStyle = '#94a3b8'; ctx.font = '700 12px sans-serif';
            ctx.fillText('LINE FLOW RATE', 841, 194);
            ctx.fillStyle = '#10b981'; ctx.font = '900 46px sans-serif';
            ctx.fillText(liveF.toFixed(1), 841, 250);
            ctx.fillStyle = '#94a3b8'; ctx.font = '600 13px sans-serif';
            ctx.fillText('L/min', 841, 282);

            // State Banner
            const stateMeta = {
                NORMAL:  { bg: 'rgba(16,185,129,0.16)',  border: '#10b981', text: '#10b981', title: 'NORMAL PATENCY', desc: 'Unrestricted secretion drainage. Baseline line resistance.' },
                PARTIAL: { bg: 'rgba(245,158,11,0.16)',  border: '#f59e0b', text: '#f59e0b', title: 'PARTIAL CLOG DETECTED', desc: 'Viscous secretion build-up in progress. Increasing draw.' },
                BLOCK:   { bg: 'rgba(239,68,68,0.18)',   border: '#ef4444', text: '#ef4444', title: 'COMPLETE TUBE OCCLUSION', desc: 'Persistent secretion plug. Zero flow. Line flush advised.' },
                TISSUE:  { bg: 'rgba(168,85,247,0.22)',  border: '#a855f7', text: '#d8b4fe', title: 'MUCOSAL TISSUE CONTACT', desc: 'Rapid dP/dt collapse! Atmospheric vent open to release mucosa.' },
                LEAK:    { bg: 'rgba(59,130,246,0.16)',  border: '#3b82f6', text: '#60a5fa', title: 'SYSTEM AIR LEAK', desc: 'Atmospheric air entrainment. Check canister or cuff seal.' },
                UNKNOWN: { bg: 'rgba(148,163,184,0.16)', border: '#94a3b8', text: '#cbd5e1', title: 'ANALYZING / UNDETERMINED', desc: 'Acoustic noise filter settling. Sensor calibration active.' }
            }[currentScenario];

            ctx.fillStyle = stateMeta.bg;
            roundRect(ctx, 582, 322, 340, 62, 10); ctx.fill();
            ctx.strokeStyle = stateMeta.border; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = stateMeta.text;
            ctx.font = '800 19px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(stateMeta.title, 752, 360);

            // Explanation Text
            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 13px sans-serif';
            ctx.fillText(stateMeta.desc, 752, 412);

            // Shallow Suction Co-Pilot Card
            ctx.fillStyle = '#0a111c';
            roundRect(ctx, 582, 558, 340, 200, 12); ctx.fill();
            ctx.strokeStyle = '#1e293b'; ctx.stroke();

            ctx.fillStyle = '#06b6d4';
            ctx.font = '700 13px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('SHALLOW SUCTION CO-PILOT', 598, 586);
            ctx.textAlign = 'right';
            ctx.font = '600 12px sans-serif';
            ctx.fillText(cfg.ett, 906, 586);

            ctx.fillStyle = '#94a3b8';
            ctx.textAlign = 'left';
            ctx.fillText('Catheter Advance', 598, 622);
            ctx.fillStyle = '#f8fafc';
            ctx.font = '700 13px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(cfg.depthTxt, 906, 622);

            // Progress Bar
            ctx.fillStyle = '#1e293b';
            roundRect(ctx, 598, 638, 308, 14, 7); ctx.fill();
            const barGrad = ctx.createLinearGradient(598, 0, 906, 0);
            barGrad.addColorStop(0, '#10b981');
            barGrad.addColorStop(1, '#f59e0b');
            ctx.fillStyle = barGrad;
            roundRect(ctx, 598, 638, 308 * cfg.fill, 14, 7); ctx.fill();

            ctx.fillStyle = '#f59e0b';
            ctx.font = '600 12px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('⚠ Prevents carina impingement & vagal', 598, 682);
            ctx.fillText('   bradycardia (AARC / NRP Guidelines).', 598, 700);

            // === COLUMN 3: FAIL-SAFE PROTECTION (x: 960, w: 296) ===
            const vGrad = ctx.createLinearGradient(0, colY, 0, colY + colH);
            vGrad.addColorStop(0, '#111a28');
            vGrad.addColorStop(1, '#0c1420');
            ctx.fillStyle = vGrad;
            roundRect(ctx, 960, colY, 296, colH, 16); ctx.fill();
            ctx.strokeStyle = isVentOpen ? '#a855f7' : '#06b6d4';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = '#a855f7';
            ctx.font = '700 14px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('FAIL-SAFE PROTECTION', 978, 136);

            ctx.fillStyle = 'rgba(168,85,247,0.22)';
            roundRect(ctx, 1148, 118, 92, 24, 6); ctx.fill();
            ctx.fillStyle = '#d8b4fe';
            ctx.font = '700 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Patent Pending', 1194, 134);

            // Inner Vent Status Box
            ctx.fillStyle = isVentOpen ? 'rgba(168,85,247,0.18)' : '#070c14';
            roundRect(ctx, 978, 168, 260, 390, 14); ctx.fill();
            ctx.strokeStyle = isVentOpen ? '#a855f7' : '#1e293b';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Vent Circle Icon
            ctx.fillStyle = isVentOpen ? '#a855f7' : 'rgba(16,185,129,0.2)';
            ctx.beginPath(); ctx.arc(1108, 305, 36, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = isVentOpen ? '#ffffff' : '#10b981';
            ctx.lineWidth = 3; ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 22px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(isVentOpen ? 'OPEN' : 'SAFE', 1108, 313);

            ctx.fillStyle = isVentOpen ? '#d8b4fe' : '#10b981';
            ctx.font = '800 17px sans-serif';
            ctx.fillText(isVentOpen ? 'FAIL-SAFE VENT: OPEN' : 'ATMOSPHERIC VENT: SEALED', 1108, 376);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 13px sans-serif';
            if (isVentOpen) {
                ctx.fillText('Atmosphere breaking vacuum', 1108, 405);
                ctx.fillText('(0 mmHg) — Mucosa released', 1108, 424);
            } else {
                ctx.fillText('Suction line vacuum', 1108, 405);
                ctx.fillText('actively maintained', 1108, 424);
            }

            // Manual Release Button
            ctx.fillStyle = isVentOpen ? '#7e22ce' : '#1e293b';
            roundRect(ctx, 978, 576, 260, 46, 10); ctx.fill();
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = '700 13px sans-serif';
            ctx.fillText('⚡ MANUAL ATMOSPHERIC RELEASE', 1108, 604);

            // Shift Metrics
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.beginPath(); ctx.moveTo(978, 640); ctx.lineTo(1238, 640); ctx.stroke();

            ctx.textAlign = 'left';
            drawMetric(978, 662, 'Subglottic Volume:', '24.5 mL', '#f8fafc');
            drawMetric(1118, 662, 'Suction Events:', '6 Today', '#f8fafc');
            drawMetric(978, 718, 'Line Resistance:', 'Normal (6.7)', '#f8fafc');
            drawMetric(1118, 718, 'Response Latency:', '22 ms', '#10b981');
        }

        function drawMetric(x, y, label, val, valColor) {
            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 12px sans-serif';
            ctx.fillText(label, x, y);
            ctx.fillStyle = valColor;
            ctx.font = '800 16px sans-serif';
            ctx.fillText(val, x, y + 21);
        }

        function drawWavePanel(x, y, w, h, label, data, min, max, color) {
            ctx.fillStyle = '#080d14';
            roundRect(ctx, x, y, w, h, 10); ctx.fill();
            ctx.strokeStyle = '#162032'; ctx.lineWidth = 1.5; ctx.stroke();

            // Grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let gy = y + 36; gy < y + h; gy += 36) {
                ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke();
            }

            // Label
            ctx.fillStyle = color;
            ctx.font = '700 13px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(label, x + 14, y + 24);

            // Waveform Trace
            ctx.strokeStyle = color;
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            const step = (w - 20) / (data.length - 1);
            data.forEach((v, i) => {
                const norm = Math.max(0, Math.min(1, (v - min) / (max - min)));
                const py = (y + h - 18) - norm * (h - 52);
                const px = x + 10 + i * step;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            });
            ctx.stroke();
        }

        // ==========================================
        // 3. THREE.JS 3D SCENE & BEDSIDE HARDWARE
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060a10);
        scene.fog = new THREE.FogExp2(0x060a10, 0.035);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(1.8, 1.1, 7.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 2.6;
        controls.maxDistance = 14;
        controls.target.set(0, 0.4, 0);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x0f172a, 0.85);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
        dirLight.position.set(5, 8, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const rimLight = new THREE.PointLight(0x06b6d4, 0.8, 15);
        rimLight.position.set(-4, 3, -3);
        scene.add(rimLight);

        // Subtle ICU Floor Grid
        const gridHelper = new THREE.GridHelper(24, 32, 0x1e293b, 0x0f172a);
        gridHelper.position.y = -3.2;
        scene.add(gridHelper);

        // Device Group
        const deviceGroup = new THREE.Group();
        deviceGroup.position.set(0, 0.4, 0);
        scene.add(deviceGroup);

        // Materials
        const absWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.35, metalness: 0.08 });
        const darkBezelMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.25, metalness: 0.4 });
        const steelMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.25, metalness: 0.85 });
        const portBlueMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3, metalness: 0.2 });
        const portCyanMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, roughness: 0.3, metalness: 0.2 });
        const tubeMat = new THREE.MeshPhysicalMaterial({
            color: 0xe0f2fe,
            transparent: true,
            opacity: 0.38,
            roughness: 0.15,
            transmission: 0.4,
            side: THREE.DoubleSide
        });

        // Stainless Steel IV Pole (Behind Device)
        const poleGeo = new THREE.CylinderGeometry(0.11, 0.11, 8.5, 24);
        const poleMesh = new THREE.Mesh(poleGeo, steelMat);
        poleMesh.position.set(0, -0.4, -0.75);
        deviceGroup.add(poleMesh);

        // IV Pole Clamp Bracket & Knob
        const clampGeo = new THREE.BoxGeometry(0.55, 0.65, 0.75);
        const clampMesh = new THREE.Mesh(clampGeo, steelMat);
        clampMesh.position.set(0, 0, -0.5);
        deviceGroup.add(clampMesh);

        const knobGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.25, 20);
        knobGeo.rotateZ(Math.PI / 2);
        const knobMesh = new THREE.Mesh(knobGeo, darkBezelMat);
        knobMesh.position.set(0.38, 0, -0.65);
        deviceGroup.add(knobMesh);

        // Main Medical ABS Console Enclosure
        const bodyGeo = new THREE.BoxGeometry(4.4, 2.85, 0.42);
        const bodyMesh = new THREE.Mesh(bodyGeo, absWhiteMat);
        bodyMesh.castShadow = true;
        deviceGroup.add(bodyMesh);

        // Front Black Screen Bezel
        const bezelGeo = new THREE.BoxGeometry(4.12, 2.6, 0.04);
        const bezelMesh = new THREE.Mesh(bezelGeo, darkBezelMat);
        bezelMesh.position.z = 0.215;
        deviceGroup.add(bezelMesh);

        // Live Screen Plane (Mapped to uiCanvas)
        const screenTexture = new THREE.CanvasTexture(uiCanvas);
        screenTexture.minFilter = THREE.LinearFilter;
        screenTexture.magFilter = THREE.LinearFilter;
        const screenGeo = new THREE.PlaneGeometry(3.92, 2.45);
        const screenMat = new THREE.MeshBasicMaterial({ map: screenTexture });
        const screenMesh = new THREE.Mesh(screenGeo, screenMat);
        screenMesh.position.z = 0.238;
        deviceGroup.add(screenMesh);

        // --- PNEUMATIC PORTS & FAIL-SAFE ATMOSPHERIC VENT ---
        function addSidePort(x, y, z, rotZ, mat) {
            const pGroup = new THREE.Group();
            const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 0.18, 20), steelMat);
            const barb = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.11, 0.26, 20), mat);
            barb.position.y = 0.2;
            pGroup.add(collar, barb);
            pGroup.position.set(x, y, z);
            pGroup.rotation.z = rotZ;
            deviceGroup.add(pGroup);
            return pGroup;
        }

        // Left Port: To Wall Vacuum
        addSidePort(-2.22, -0.25, 0, Math.PI / 2, steelMat);

        // Right Upper Port: Subglottic (EVAC)
        addSidePort(2.22, 0.45, 0, -Math.PI / 2, portCyanMat);

        // Right Lower Port: Closed Suction Catheter
        addSidePort(2.22, -0.25, 0, -Math.PI / 2, portBlueMat);

        // Right Top Port: FAIL-SAFE ATMOSPHERIC SOLENOID VENT VALVE
        const ventHousing = new THREE.Mesh(
            new THREE.CylinderGeometry(0.16, 0.18, 0.24, 24),
            steelMat
        );
        ventHousing.rotation.z = -Math.PI / 2;
        ventHousing.position.set(2.28, 1.02, 0);
        deviceGroup.add(ventHousing);

        const ventRingMat = new THREE.MeshStandardMaterial({
            color: 0x10b981,
            emissive: 0x10b981,
            emissiveIntensity: 0.7,
            roughness: 0.2
        });
        const ventCap = new THREE.Mesh(
            new THREE.CylinderGeometry(0.13, 0.13, 0.12, 24),
            ventRingMat
        );
        ventCap.rotation.z = -Math.PI / 2;
        ventCap.position.set(2.42, 1.02, 0);
        deviceGroup.add(ventCap);

        // --- MEDICAL TUBING CURVES & FLOW PARTICLES ---
        const wallCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-2.45, -0.25, 0),
            new THREE.Vector3(-3.3, -0.45, 0.15),
            new THREE.Vector3(-4.1, -1.1, 0.1),
            new THREE.Vector3(-4.8, -2.2, -0.2)
        ]);
        const evacCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(2.45, 0.45, 0),
            new THREE.Vector3(3.3, 0.25, 0.2),
            new THREE.Vector3(4.1, -0.4, 0.25),
            new THREE.Vector3(4.8, -1.5, 0.1)
        ]);
        const deepCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(2.45, -0.25, 0),
            new THREE.Vector3(3.35, -0.55, 0.15),
            new THREE.Vector3(4.15, -1.25, 0.15),
            new THREE.Vector3(4.8, -2.3, 0.0)
        ]);

        [wallCurve, evacCurve, deepCurve].forEach(curve => {
            const tGeo = new THREE.TubeGeometry(curve, 48, 0.075, 16, false);
            const tMesh = new THREE.Mesh(tGeo, tubeMat);
            deviceGroup.add(tMesh);
        });

        // Hydrophobic Bacterial Filter & Trap on EVAC Line
        const trapGroup = new THREE.Group();
        const trapBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.22, 0.20, 0.55, 24),
            new THREE.MeshPhysicalMaterial({ color: 0xfef08a, transparent: true, opacity: 0.55, roughness: 0.2 })
        );
        const filterDisk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.24, 0.24, 0.12, 24),
            absWhiteMat
        );
        filterDisk.position.y = 0.32;
        trapGroup.add(trapBody, filterDisk);
        trapGroup.position.set(3.45, 0.15, 0.22);
        trapGroup.rotation.z = 0.35;
        deviceGroup.add(trapGroup);

        // Floating 3D Text Labels on Ports
        function create3DLabel(text, x, y, z, bgHex) {
            const c = document.createElement('canvas');
            c.width = 360; c.height = 76;
            const cx = c.getContext('2d');
            cx.fillStyle = bgHex || 'rgba(15, 23, 42, 0.9)';
            roundRect(cx, 4, 4, 352, 68, 16); cx.fill();
            cx.strokeStyle = '#38bdf8'; cx.lineWidth = 3; cx.stroke();
            cx.fillStyle = '#ffffff';
            cx.font = '800 24px sans-serif';
            cx.textAlign = 'center';
            cx.fillText(text, 180, 46);

            const tex = new THREE.CanvasTexture(c);
            const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
            sp.position.set(x, y, z);
            sp.scale.set(1.45, 0.31, 1);
            deviceGroup.add(sp);
        }

        create3DLabel('TO WALL VACUUM', -3.35, 0.25, 0.2);
        create3DLabel('FAIL-SAFE VENT', 3.35, 1.15, 0.1, 'rgba(88, 28, 135, 0.92)');
        create3DLabel('SUBGLOTTIC (EVAC)', 3.65, 0.65, 0.25);
        create3DLabel('CLOSED SUCTION', 3.65, -0.85, 0.2);

        // Animated Flow Particles inside Tubes
        const particleCount = 45;
        const particles = [];
        const pGeo = new THREE.SphereGeometry(0.038, 10, 10);
        const pMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });

        for (let i = 0; i < particleCount; i++) {
            const mesh = new THREE.Mesh(pGeo, pMat);
            deviceGroup.add(mesh);
            const curveChoice = i % 3 === 0 ? wallCurve : (i % 3 === 1 ? evacCurve : deepCurve);
            const reverseDir = (curveChoice !== wallCurve);
            particles.push({
                mesh,
                curve: curveChoice,
                t: (i / particleCount),
                reverse: reverseDir
            });
        }

        // ==========================================
        // 4. CAMERA PRESET ANIMATION (SCREEN FOCUS)
        // ==========================================
        let targetCamPos = new THREE.Vector3(1.8, 1.1, 7.2);
        let targetLookAt = new THREE.Vector3(0, 0.4, 0);
        let isTransitioningCam = false;

        function setCameraView(view) {
            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
            isTransitioningCam = true;

            if (view === 'OVERVIEW') {
                document.getElementById('camOverview').classList.add('active');
                targetCamPos.set(1.8, 1.1, 7.2);
                targetLookAt.set(0, 0.4, 0);
            } else if (view === 'SCREEN') {
                document.getElementById('camScreen').classList.add('active');
                targetCamPos.set(0, 0.4, 3.85);
                targetLookAt.set(0, 0.4, 0.24);
            } else if (view === 'VALVE') {
                document.getElementById('camValve').classList.add('active');
                targetCamPos.set(4.4, 1.3, 3.6);
                targetLookAt.set(2.3, 0.45, 0);
            }
        }

        controls.addEventListener('start', () => {
            isTransitioningCam = false;
        });

        // ==========================================
        // 5. DIRECT RAYCAST CLICKING ON 3D SCREEN
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('pointerdown', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObject(screenMesh);
            if (hits.length > 0) {
                const uv = hits[0].uv;
                const cx = uv.x * 1280;
                const cy = (1 - uv.y) * 800;

                if (cy >= 20 && cy <= 64) {
                    if (cx >= 610 && cx < 688) setProfile('ADULT');
                    else if (cx >= 688 && cx < 766) setProfile('PEDIATRIC');
                    else if (cx >= 766 && cx <= 845) setProfile('NEONATAL');
                    else if (cx >= 860 && cx < 1002) setMode('SUBGLOTTIC');
                    else if (cx >= 1002 && cx <= 1145) setMode('CO_PILOT');
                }
                if (cx >= 978 && cx <= 1238 && cy >= 576 && cy <= 622) {
                    toggleManualVent();
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 6. MAIN RENDER & ANIMATION LOOP
        // ==========================================
        let frameCounter = 0;

        function animate() {
            requestAnimationFrame(animate);
            frameCounter++;

            if (frameCounter % 3 === 0) {
                updateTelemetryMath();
                drawScreenUI();
                screenTexture.needsUpdate = true;
            }

            if (isVentOpen) {
                ventRingMat.color.setHex(0xa855f7);
                ventRingMat.emissive.setHex(0xa855f7);
                ventRingMat.emissiveIntensity = 1.4 + Math.sin(Date.now() / 80) * 0.5;
                ventCap.position.x = 2.52;
            } else {
                ventRingMat.color.setHex(0x10b981);
                ventRingMat.emissive.setHex(0x10b981);
                ventRingMat.emissiveIntensity = 0.6;
                ventCap.position.x = 2.42;
            }

            let speed = 0.008;
            let pColor = 0x06b6d4;
            if (currentScenario === 'PARTIAL') { speed = 0.003; pColor = 0xf59e0b; }
            else if (currentScenario === 'BLOCK') { speed = 0.0; pColor = 0xef4444; }
            else if (currentScenario === 'TISSUE') { speed = isVentOpen ? 0.012 : 0.0; pColor = 0xa855f7; }
            else if (currentScenario === 'LEAK') { speed = 0.015; pColor = 0x60a5fa; }

            pMat.color.setHex(pColor);
            particles.forEach(p => {
                if (speed > 0) {
                    p.t += p.reverse ? -speed : speed;
                    if (p.t > 1) p.t -= 1;
                    if (p.t < 0) p.t += 1;
                }
                const pt = p.curve.getPointAt(p.t);
                p.mesh.position.copy(pt);
            });

            if (isTransitioningCam) {
                camera.position.lerp(targetCamPos, 0.08);
                controls.target.lerp(targetLookAt, 0.08);
                if (camera.position.distanceTo(targetCamPos) < 0.02) {
                    isTransitioningCam = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        drawScreenUI();
        screenTexture.needsUpdate = true;
        animate();
    </script>
</body>
</html>
